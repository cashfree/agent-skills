name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.target_commitish }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org/

            - name: Install dependencies
              run: npm ci

            - name: Extract version from release tag
              id: version
              run: |
                  TAG="${{ github.event.release.tag_name }}"
                  VERSION="${TAG#v}"
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            - name: Update package version
              run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

            - name: Inject runtime telemetry config
              run: |
                  node -e "const fs = require('fs'); const file = 'src/telemetry.ts'; const host = process.env.POSTHOG_HOST || ''; const apiKey = process.env.POSTHOG_PROJECT_API_KEY || ''; let content = fs.readFileSync(file, 'utf8'); content = content.replace('__POSTHOG_HOST__', host).replace('__POSTHOG_API_KEY__', apiKey); fs.writeFileSync(file, content);"
              env:
                  POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
                  POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

            - name: Build package
              run: npm run build

            - name: Publish to npm
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Commit and push version update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
                  git push
